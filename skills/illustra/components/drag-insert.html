<!-- name: drag-insert | tier: A | purpose: drop indicator - green insert line + circular "+" handle
     params: width via inline; handle sits at center of the line
     usage: overlay between bento blocks to show where a dragged section lands; pair with il-cursor -->
<div class="il-insert" style="width:380px">
  <span class="il-insert__plus"></span>
</div>

<style>
  .il-insert { position: relative; height: 2px; background: var(--accent-green); border-radius: var(--r-pill); }
  .il-insert__plus {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-green); box-shadow: var(--glow-green);
    display: grid; place-items: center;
  }
  .il-insert__plus::before, .il-insert__plus::after { content: ""; position: absolute; background: var(--text-100); border-radius: 1px; }
  .il-insert__plus::before { width: 10px; height: 2px; }
  .il-insert__plus::after { width: 2px; height: 10px; }
</style>
