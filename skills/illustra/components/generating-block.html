<!-- name: generating-block | tier: A | purpose: a storefront section being generated by AI RIGHT NOW - the "build in progress" moment. Glow-mint border + a thin assembly beam landing on the top edge + a forming image tile + copy lines being written (the last with a typing cursor). The OUTPUT/build half of a dual-view (pairs with ai-prompt-panel as the input half).
     params: width/height inline (424x134 default); the bright top copy line MAY hold real generated
       text (reads as "writes the copy" - R12); colors ride the marketing-dark group --mkdark-page /
       -purple / -line / -mint / -bar / -dim. Drop INSIDE a dark built-page (the page must be
       position:relative + overflow:hidden so the glow clips with it), placed as the LAST (newest)
       section below already-solid ones.
     usage: the BUILD moment in an "AI builds the page" illustration - solid sections above, THIS one
       glowing/forming. Differs from scan-overlay (a horizontal beam REVEALING a static page): this is
       ONE section ASSEMBLING with a typing cursor. Anchor a "Generating..." / "Writing your copy..."
       frost-chip at its top edge - a status flag on the thing it flags (R11). -->

</div>
