<!-- name: frost-chip | tier: A | purpose: light "frost" status pill riding on a dark marketing page - the SSE-151 badge language ("26.8% CR" / "Page Checkup is scanning..."). Icon tile + short label.
     params: label text; icon tile optional (default = gradient AI tile + sparkle; swap the svg, or
       remove the tile for icon-less stat chips). Colors: --chip-frost-bg / -border / -text; icon
