<!-- name: concentric-rings | tier: A | purpose: radar / sonar arc rings around a focal point
     params: add/edit <circle> (r = radius, opacity, transform rotate = arc direction, stroke-dasharray = arc gap on pathLength 100); size via width/height
     usage: behind a glow-orb / logo-pin to imply reach & signal; place the focal element centered on top -->
<svg class="il-rings" viewBox="0 0 360 360" width="360" height="360" aria-hidden="true">
  <g class="il-rings__g" fill="none" stroke="var(--brand-accent)" stroke-linecap="round">
    <circle cx="180" cy="180" r="64"  stroke-width="2.5" opacity="0.7"  pathLength="100" stroke-dasharray="60 40" transform="rotate(18 180 180)" />
    <circle cx="180" cy="180" r="104" stroke-width="2"   opacity="0.45" pathLength="100" stroke-dasharray="56 44" transform="rotate(-34 180 180)" />
    <circle cx="180" cy="180" r="146" stroke-width="2"   opacity="0.28" pathLength="100" stroke-dasharray="52 48" transform="rotate(14 180 180)" />
    <circle cx="180" cy="180" r="174" stroke-width="1.5" opacity="0.15" pathLength="100" stroke-dasharray="48 52" transform="rotate(-22 180 180)" />
  </g>
</svg>

<style>
  .il-rings { display: block; }
  .il-rings__g { filter: blur(0.6px); }
</style>
