<!-- name: ai-prompt-panel | tier: A | purpose: white in-app "describe -> generate" prompt card (the AI Smart Page input) - gradient AI tile + feature title, an uppercase field label, a textarea showing the REAL prompt the merchant types, and a mint primary action button. The config/INPUT half of a dark-marketing dual-view (pairs with generating-block / a built page as the OUTPUT half).
     params: title text; field label; prompt text (REAL representative copy - a believable product
       description, NOT skeleton bars: this surface IS the demo of "describe your product", so dummy
       bars dilute it - R12); button label; width/height inline (332x296 default). Surfaces = light
       Polaris (--inset-*); AI tile gradient --mkdark-line -> --mkdark-purple; button = --mkdark-mint
       with --mkdark-mint-ink text (dark-marketing family) - swap to --brand-accent / --text-100 for
       a light Mode-A card.
     usage: the SATELLITE (config side) of a dual-view dark-marketing illustration (style-guide
       "Dual-view palette roles"); keep it <=~85% of the built-page/output primary's width (R1) and
       overlap the output panel at a corner (R1/R7). On a dark card bg it carries its own white
       surface (hard rule 3). No fabricated brand names in the prompt text (R12). -->
