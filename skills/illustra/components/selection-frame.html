<!-- name: selection-frame | tier: A | purpose: editor selection overlay - blue dashed border + label tag + corner handles
     params: label text; wrap any element (screenshot-frame / block) as a child of .il-select
     usage: put around a screenshot to show it is the selected / editable element -->
<div class="il-select" style="width:220px; height:280px">
  <span class="il-select__tag">Image</span>
  <!-- wrapped element (e.g. screenshot-frame) goes here -->
  <span class="il-select__h il-select__h--tl"></span>
  <span class="il-select__h il-select__h--tr"></span>
  <span class="il-select__h il-select__h--bl"></span>
  <span class="il-select__h il-select__h--br"></span>
</div>

<style>
  .il-select { position: relative; border: 2px dashed var(--accent-blue); border-radius: var(--r-xl); }
  .il-select__tag {
    position: absolute; top: -12px; left: -2px;
    font-family: var(--font-body); font-weight: var(--fw-medium); font-size: 12px;
    color: var(--text-100); background: var(--brand-accent); padding: 3px 9px; border-radius: var(--r-sm);
  }
  .il-select__h { position: absolute; width: 9px; height: 9px; background: var(--inset-bg); border: 2px solid var(--accent-blue); border-radius: 2px; }
  .il-select__h--tl { top: -5px; left: -5px; }
  .il-select__h--tr { top: -5px; right: -5px; }
  .il-select__h--bl { bottom: -5px; left: -5px; }
  .il-select__h--br { bottom: -5px; right: -5px; }
</style>
