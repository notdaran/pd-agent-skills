<!--
  logo-lockup - centered intro lockup: logo + kicker + title + accent bar + subhead
  Source: examples/before-after .s1-center
  Purpose: the opening brand statement of a teaser (scene 1). One title accent word in soft purple.
  Vars: --brand-accent-soft (kicker + accent word), --brand-accent (bar), --text (subhead).
  Fonts: literal "Poppins" (the renderer cannot resolve var(--font-*); see style-guide).
  Eyebrow: OPTIONAL, and only two valid forms per _pf-brand/label-rules.md rules 1-4 -
    (a) plain sentence-case Poppins text (the .pf-kicker below), or
    (b) a soft badge from _pf-brand/badges.html (Solid on navy - Tint purple measures 3.7:1
        and fails AA; see style-guide -> Labels & badges).
    Dropping it entirely is fine (outputs/checkup-sharper does). The mono, ALL-CAPS, 0.34em-tracked
    eyebrow this block used to ship is the dated look label-rules kills - do not bring it back.
  Params: swap img src, kicker/title/subhead text; accent word = inline <span style="color:var(--brand-accent-soft)">.
          With HyperFrames variables, wire title/kicker/subtitle from getVariables() in the script instead.
-->
<style>
  .pf-lockup {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #pf-logo { display: block; height: 64px; width: auto; margin-bottom: 36px; }
  .pf-kicker {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--brand-accent-soft);
  }
  #pf-title { font-size: 142px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 30px; }
  #pf-bar {
    height: 6px;
    width: 300px;
    margin-top: 38px;
    background: var(--brand-accent);
    border-radius: var(--r-pill);
    transform-origin: left center;
  }
  #pf-sub {
    font-size: 42px;
    font-weight: 200;
    color: var(--text);
    margin-top: 42px;
    text-align: center;
    width: 1120px;
    line-height: 1.3;
  }
</style>

<div class="pf-lockup">
  <img id="pf-logo" src="assets/pf-logo.svg" alt="PageFly" />
  <div id="pf-kicker" class="pf-kicker">New in PageFly</div>
  <div id="pf-title">Page <span style="color:var(--brand-accent-soft);">Checkup</span></div>
  <div id="pf-bar"></div>
  <div id="pf-sub">Score your page. Fix what's costing you conversions.</div>
</div>
