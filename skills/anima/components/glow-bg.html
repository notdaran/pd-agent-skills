<!--
  glow-bg - breathing radial brand glows + concentric rings (the navy depth layer)
  Source: examples/before-after #s1-glow-p / #s1-glow-b / .s1-ring (+ #s2-glow-* variant)
  Purpose: diffuse purple/blue radial depth behind any scene; the rings add a lockup halo.
  Vars: --glow-accent, --glow-blue (fills), --brand-accent-soft (ring borders, via color-mix).
  Place: first children of a scene, behind all content. Glows start opacity:0 so the loop
         seam (t=duration -> t=0) lands on pure navy. Drop the two rings if not a centered lockup.
  Params: glow size / position inline; ring sizes inline.
-->
<style>
  .pf-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(150px);
  }
  .pf-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
</style>

<div id="pf-glow-accent" class="pf-glow" data-layout-ignore
     style="width:920px;height:920px;background:var(--glow-accent);top:-300px;right:-200px;opacity:0;"></div>
<div id="pf-glow-blue" class="pf-glow" data-layout-ignore
     style="width:840px;height:840px;background:var(--glow-blue);bottom:-300px;left:-180px;filter:blur(175px);opacity:0;"></div>
<div class="pf-ring" data-layout-ignore
     style="width:900px;height:900px;border:2px solid color-mix(in srgb, var(--brand-accent-soft) 12%, transparent);"></div>
<div class="pf-ring" data-layout-ignore
     style="width:1240px;height:1240px;border:2px solid color-mix(in srgb, var(--brand-accent-soft) 7%, transparent);"></div>

<!-- Timeline recipe (example offsets; rebase to your scene's enter time) -->

  tl.to(["#pf-glow-accent", "#pf-glow-blue"], { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.1);
  tl.to("#pf-glow-accent", { scale: 1.12, duration: 2.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.1);
  tl.to("#pf-glow-blue",   { scale: 1.16, duration: 2.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.3);
  tl.fromTo(".pf-ring", { scale: 0.84, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.3, stagger: 0.14, ease: "power2.out" }, 0.1);
-->
