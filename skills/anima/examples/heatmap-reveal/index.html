<!DOCTYPE html>
<!--
  anima worked example #2 — "New in PageFly: Heatmaps" (a single-feature reveal).
  Composed on templates/canvas.html from kit blocks: glow-bg + logo-lockup (scene 1),
  then a heatmap-reveal beat (glow-bg + a browser-card whose clean page crossfades to a
  heatmap under a scan-beam sweep), closed by loop-tail. Structure differs from the
  before-after example: a single-state reveal, no score ring / no numeric morph.
  Standalone composition => NO <template> wrapper.

  Labels follow the shared _pf-brand kit (_pf-brand/label-rules.md): the "New" flag is a Solid
  badge (status bound to the title); the eyebrow + view-state labels ("Page view" / "Heatmap")
  are plain Poppins sentence-case text - a badge flags status, a label that describes content
  is plain text (rule 7). Replaces the old dated mono-caps, wide-tracked eyebrow + boxed state
  chips.
-->
<html
  lang="en"
  data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"New in PageFly"},
  {"id":"title","type":"string","label":"Title","default":"Heatmaps"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"See exactly where visitors look, scroll, and click."},
  {"id":"brandName","type":"string","label":"Brand name","default":"Heatmaps"},
  {"id":"captionBefore","type":"string","label":"Caption before","default":"Your live store page"},
  {"id":"captionAfter","type":"string","label":"Caption after","default":"See where visitors actually look"},
  {"id":"stateBefore","type":"string","label":"State before","default":"Page view"},
  {"id":"stateAfter","type":"string","label":"State after","default":"Heatmap"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* tokens synced from references/brand.css - keep in sync when the preset changes */
      :root {
        /* Layer A - brand identity */
        --brand-accent: #535AF7;
        --brand-accent-soft: #A6ACFF;
        --brand-cyan: #67DCF9;
        /* fonts: the renderer auto-resolves LITERAL family names only, NOT var(--font-*). */
        --font-heading: "Poppins", sans-serif;
        --font-body: "Poppins", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --fw-extralight: 200;
        --fw-regular: 400;
        --fw-medium: 500;
        --fw-bold: 700;
        /* Layer B - video surface palette */
        --bg: #030712;
        --surface: #11141E;
        --border: #1E222B;
        --text: rgba(255, 255, 255, 0.96);
        --text-muted: #8A8FA3;
        --sem-critical: #FF5C5C;
        --sem-warning: #FFC453;
        --sem-success: #22C55E;
        --r-sm: 8px;
        --r-md: 16px;
        --r-pill: 9999px;
        --glow-accent: rgba(83, 90, 247, 0.30);
        --glow-blue: rgba(61, 107, 255, 0.20);
        /* Badge palette (synced from _pf-brand/brand-identity.css) - chips / eyebrows */
        --badge-purple: #8b5cf6;
        --badge-gray:   #94a3b8;
        --badge-green:  #22c55e;
        --badge-blue:   #3b82f6;
        --badge-yellow: #eab308;
        --badge-neutral:#e2e8f0;
        --badge-radius: 8px;
        --badge-text-dark: #0f172a;
      }

      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Poppins", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--bg);
      }
      #s1 { z-index: 1; }
      #s2 { z-index: 2; opacity: 0; }
      #loopveil {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: var(--bg);
        opacity: 0;
        pointer-events: none;
      }

      /* ===== shared badge kit (_pf-brand/badges.html) - Poppins, sentence case, soft 8px ===== */
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0;
        line-height: 1;
        padding: 9px 18px;
        border-radius: var(--badge-radius);
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .badge.tint  { color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border-color: color-mix(in srgb, var(--c) 34%, transparent); }
      .badge.ghost { color: var(--c); background: transparent; border-color: transparent; }
      .badge.solid { color: var(--badge-text-dark); background: color-mix(in srgb, var(--c) 46%, white); border-color: transparent; }
      .badge .dot  { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .c-purple { --c: var(--badge-purple); }
      .c-gray   { --c: var(--badge-gray); }
      .c-green  { --c: var(--badge-green); }
      .c-blue   { --c: var(--badge-blue); }
      .c-yellow { --c: var(--badge-yellow); }
      .c-neutral{ --c: var(--badge-neutral); }

      /* ===== glow-bg (kit) - diffuse blue/purple radial depth ===== */
      .glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(150px);
      }

      /* ===== logo-lockup (kit) - scene 1 ===== */
      .s1-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #s1-logo { display: block; height: 64px; width: auto; margin-bottom: 36px; }
      .kicker {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--brand-accent-soft);
      }
      #s1-title { font-size: 152px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin-top: 30px; }
      .accent-bar {
        height: 6px;
        background: var(--brand-accent);
        border-radius: var(--r-pill);
        transform-origin: left center;
      }
      #s1-sub {
        font-size: 42px;
        font-weight: 200;
        color: var(--text);
        margin-top: 42px;
        text-align: center;
        width: 1160px;
        line-height: 1.3;
      }

      /* ===== scene 2 - heatmap reveal ===== */
      .topbar {
        position: absolute;
        top: 56px;
        left: 180px;
        width: 1240px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand-row { display: flex; align-items: center; gap: 18px; }
      .brand-name { font-size: 36px; font-weight: 600; letter-spacing: -0.01em; }
      .state-wrap { position: relative; width: 340px; height: 44px; }
      /* state label = plain descriptive text (names the view shown below), NOT a badge.
         A badge flags status ("New"); a label that describes content is plain text. */
      .state-label {
        position: absolute;
        right: 0;
        top: 0;
        line-height: 44px;
        font-size: 26px;
        font-weight: 500;
        white-space: nowrap;
      }
      #s2-state-before { color: var(--text-muted); }
      #s2-state-after  { color: var(--brand-accent-soft); }

      /* browser-card holding the page screenshot (clean -> heatmap crossfade) */
      .hm-card {
        position: absolute;
        left: 180px;
        top: 120px;
        width: 1240px;
        height: 684px;
        overflow: hidden;
        border-radius: var(--r-md);
        border: 2px solid var(--border);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        background: #0b0e16;        /* neutral backing behind the screenshot */
      }
      .hm-shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

      /* caption line under the card (before -> after swap on the reveal) */
      .hm-caption {
        position: absolute;
        left: 0;
        top: 826px;
        width: 1600px;
        height: 48px;
      }
      #hm-cap-before, #hm-cap-after {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.2;
      }
      #hm-cap-before { color: var(--text-muted); }
      #hm-cap-after  { color: var(--text); opacity: 0; }
      #hm-cap-after b { color: var(--brand-accent-soft); font-weight: 600; }

      /* cyan scan-beam marking the reveal moment (cyan = beam only) */
      .scan-beam {
        position: absolute;
        top: 0;
        left: 0;
        width: 160px;
        height: 900px;
        background: linear-gradient(90deg, rgba(103,220,249,0) 0%, rgba(103,220,249,0.5) 50%, rgba(103,220,249,0) 100%);
        box-shadow: 0 0 70px var(--brand-cyan);
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1600"
      data-height="900"
      data-start="0"
      data-duration="10"
    >
      <!-- ============ SCENE 1 — INTRO LOCKUP ============ -->
      <!-- clip window: see ../../references/style-guide.md -> QA gotchas. Without it #s1 lingers
           under #s2 and its text reports occlusion / phantom contrast for the whole 10s.
           3.0 = T2 2.3 + the 0.6s crossfade + slack. -->
      <div id="s1" class="scene clip" data-start="0" data-duration="3.0" data-track-index="1">
        <!-- glow-bg -->
        <div id="s1-glow-p" class="glow" data-layout-ignore style="width:920px;height:920px;background:var(--glow-accent);top:-300px;right:-200px;opacity:0;"></div>
        <div id="s1-glow-b" class="glow" data-layout-ignore style="width:840px;height:840px;background:var(--glow-blue);bottom:-300px;left:-180px;filter:blur(175px);opacity:0;"></div>
        <div class="s1-ring" data-layout-ignore style="position:absolute;top:50%;left:50%;width:900px;height:900px;border:2px solid color-mix(in srgb, var(--brand-accent-soft) 12%, transparent);border-radius:50%;transform:translate(-50%,-50%);"></div>
        <div class="s1-ring" data-layout-ignore style="position:absolute;top:50%;left:50%;width:1240px;height:1240px;border:2px solid color-mix(in srgb, var(--brand-accent-soft) 7%, transparent);border-radius:50%;transform:translate(-50%,-50%);"></div>

        <!-- logo-lockup -->
        <div class="s1-center">
          <img id="s1-logo" src="assets/pf-logo.svg" alt="PageFly" />
          <div id="s1-kick" class="kicker">New in PageFly</div>
          <div id="s1-title">Heatmaps</div>
          <div id="s1-bar" class="accent-bar" style="width:300px;margin-top:38px;"></div>
          <div id="s1-sub">See exactly where visitors look, scroll, and click.</div>
        </div>
      </div>

      <!-- ============ SCENE 2 — HEATMAP REVEAL ============ -->
      <div id="s2" class="scene">
        <div id="s2-glow-p" class="glow" data-layout-ignore style="width:820px;height:820px;background:var(--glow-accent);top:-260px;left:-220px;"></div>
        <div id="s2-glow-b" class="glow" data-layout-ignore style="width:760px;height:760px;background:var(--glow-blue);bottom:-280px;right:-220px;filter:blur(175px);"></div>

        <!-- topbar: brand + state chip -->
        <div class="topbar">
          <div id="s2-brand" class="brand-row">
            <span id="s2-brand-name" class="brand-name">Heatmaps</span>
            <span class="badge solid c-purple">New</span>
          </div>
          <div class="state-wrap">
            <div id="s2-state-before" class="state-label">Page view</div>
            <div id="s2-state-after" class="state-label" style="opacity:0;">Heatmap</div>
          </div>
        </div>

        <!-- browser card: clean page -> heatmap -->
        <div id="hm-card" class="hm-card">
          <img id="hm-shot-clean" class="hm-shot" src="assets/page-clean.png" alt="store page" />
          <img id="hm-shot-heat" class="hm-shot" src="assets/page-heatmap.png" alt="store page heatmap" style="opacity:0;" />
        </div>

        <!-- caption before/after -->
        <div class="hm-caption" data-layout-allow-overflow>
          <div id="hm-cap-before">Your live store page</div>
          <div id="hm-cap-after">See where visitors <b>actually look</b></div>
        </div>

        <!-- scan beam (reveal moment) -->
        <div id="hm-beam" class="scan-beam" data-layout-allow-overflow></div>
      </div>

      <!-- loop-tail -->
      <div id="loopveil"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Case variables (HF runtime). Standalone/validate falls back to inline defaults.
      var v = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : null;
      if (v) {
        document.getElementById("s1-kick").textContent = v.kicker;
        document.getElementById("s1-title").textContent = v.title;
        document.getElementById("s1-sub").textContent = v.subtitle;
        document.getElementById("s2-brand-name").textContent = v.brandName;
        document.getElementById("hm-cap-before").textContent = v.captionBefore;
        document.getElementById("hm-cap-after").innerHTML = v.captionAfter;
        document.getElementById("s2-state-before").textContent = v.stateBefore;
        document.getElementById("s2-state-after").textContent = v.stateAfter;
      }

      var tl = gsap.timeline({ paused: true });

      var T2 = 2.3; // scene 2 enters
      var TF = 4.6; // reveal moment (scan + heatmap crossfade)

      /* ===== SCENE 1 — INTRO (0 .. T2) ===== */
      // glows start hidden (inline opacity:0) so the loop seam (t=10 -> t=0) lands on pure navy.
      tl.to(["#s1-glow-p", "#s1-glow-b"], { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.1);
      tl.to("#s1-glow-p", { scale: 1.12, duration: 2.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.1);
      tl.to("#s1-glow-b", { scale: 1.16, duration: 2.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.3);
      tl.fromTo(".s1-ring", { scale: 0.84, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.3, stagger: 0.14, ease: "power2.out" }, 0.1);
      tl.fromTo("#s1-logo", { y: -28, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#s1-kick", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.25);
      tl.fromTo("#s1-title", { scale: 1.14, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.4);
      tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power4.inOut" }, 0.95);
      tl.fromTo("#s1-sub", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 1.1);

      /* ===== TRANSITION 1 -> 2 : blur crossfade ===== */
      tl.fromTo("#s2", { opacity: 0, scale: 1.04, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, T2);

      /* ===== SCENE 2 — PAGE-VIEW state (clean page) ===== */
      tl.to("#s2-glow-p", { scale: 1.14, duration: 3.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, T2);
      tl.to("#s2-glow-b", { scale: 1.18, duration: 3.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, T2 + 0.4);
      tl.fromTo("#s2-brand", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, T2 + 0.15);
      tl.fromTo("#s2-state-before", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, T2 + 0.2);
      tl.fromTo("#hm-card", { y: 44, opacity: 0, scale: 1.03 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, T2 + 0.3);
      tl.fromTo("#hm-cap-before", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.out" }, T2 + 0.6);

      /* ===== REVEAL (~TF) : scan sweep -> crossfade to heatmap ===== */
      tl.fromTo("#hm-beam", { x: -200, opacity: 0 }, { x: 1600, opacity: 1, duration: 1.0, ease: "sine.inOut" }, TF);
      tl.to("#hm-beam", { opacity: 0, duration: 0.3, overwrite: "auto" }, TF + 0.85);

      // clean page -> heatmap crossfade (in-place state morph, same gu as before-after swap)
      tl.to("#hm-shot-clean", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, TF + 0.5);
      tl.fromTo("#hm-shot-heat", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, TF + 0.5);

      // caption swap: before -> after
      tl.to("#hm-cap-before", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, TF + 0.55);
      tl.fromTo("#hm-cap-after", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, TF + 0.75);

      // state chip: Page view -> Heatmap
      tl.to("#s2-state-before", { opacity: 0, y: 14, duration: 0.35, ease: "power2.in" }, TF + 0.55);
      tl.fromTo("#s2-state-after", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, TF + 0.7);

      /* ===== LOOP TAIL : fade to navy to match frame 0 ===== */
      tl.fromTo("#loopveil", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.in" }, 9.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
